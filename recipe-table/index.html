<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Table Parser</title>
    <style>
      :root {
        --border: #c9c2b6;
        --ink: #2c2822;
        --op-bg: #f3efe6;
        --ing-bg: #ffffff;
        --prep-bg: #e9e3d5;
        --accent: #8a5a2b;
        --uncertain-bg: #fff4d6;
        --uncertain-border: #e0a92e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: #faf8f3;
      }
      header.app { padding: 20px 24px 8px; }
      header.app h1 { margin: 0 0 2px; font-size: 20px; }
      header.app p { margin: 0; color: #6a6459; font-size: 13px; }
      main { padding: 16px 24px 48px; }
      .controls { display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
      textarea {
        width: 100%;
        min-height: 200px;
        resize: vertical;
        padding: 10px 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
      }
      .buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button {
        font: inherit;
        padding: 8px 16px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #fff; }
      button.primary:disabled { opacity: 0.55; cursor: default; }
      button.secondary { background: #fff; color: var(--accent); }
      #status { min-height: 20px; font-size: 13px; color: #6a6459; }
      #status.error { color: #b3261e; }

      #output { margin-top: 20px; overflow-x: auto; }
      .recipe-title { margin: 0 0 2px; font-size: 22px; }
      .servings { margin: 0 0 14px; color: #6a6459; font-size: 13px; }

      table.recipe-table {
        border-collapse: collapse;
        border: 1px solid var(--border);
      }
      table.recipe-table td.cell {
        border: 1px solid var(--border);
        padding: 8px 12px;
        vertical-align: middle;
      }
      td.ingredient {
        background: var(--ing-bg);
        white-space: nowrap;
      }
      td.ingredient .qty { color: #6a6459; margin-right: 6px; }
      td.ingredient .name { font-weight: 600; }
      td.ingredient .note {
        display: inline-block;
        margin-left: 6px;
        font-size: 11px;
        font-style: italic;
        color: var(--accent);
      }
      td.ingredient.uncertain { background: var(--uncertain-bg); }
      td.ingredient.uncertain { box-shadow: inset 3px 0 0 var(--uncertain-border); }
      td.ingredient .flag {
        display: inline-block;
        margin-left: 8px;
        font-size: 11px;
        color: #9a6b00;
        border: 1px solid var(--uncertain-border);
        border-radius: 4px;
        padding: 0 4px;
      }
      td.op {
        background: var(--op-bg);
        text-align: center;
        font-weight: 600;
      }
      td.gap { background: #faf8f3; border-color: #ece7dc; }
      td.prep {
        background: var(--prep-bg);
        font-weight: 600;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <header class="app">
      <h1>Recipe Table Parser</h1>
      <p>Paste raw recipe text, parse it into a dependency tree, and render it as a Cooking-for-Engineers table.</p>
    </header>
    <main>
      <div class="controls">
        <textarea id="input" placeholder="Paste raw recipe text here…" spellcheck="false"></textarea>
        <div class="buttons">
          <button id="parse" class="primary" type="button">Parse recipe</button>
          <button id="sample" class="secondary" type="button">Load sample</button>
        </div>
        <div id="status"></div>
      </div>
      <div id="output"></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
