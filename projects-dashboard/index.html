<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Skills &amp; Automations</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #11151c;
    --panel-2: #161b25;
    --line: #232a36;
    --text: #e6e9ef;
    --muted: #8a93a3;
    --accent: #6aa6ff;
    --idea: #7c8db5;
    --draft: #ffd84d;
    --active: #6aa6ff;
    --paused: #b48cff;
    --shipped: #5ed3a0;
    --archived: #5a6273;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font: inherit;
  }
  header button:hover { border-color: var(--accent); }
  header .status { color: var(--muted); font-size: 12px; }
  header input.filter {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; width: 200px;
  }
  header input.filter:focus { outline: none; border-color: var(--accent); }
  main {
    padding: 16px 20px 80px;
    overflow-x: auto;
  }
  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 300px;
    gap: 12px;
    align-items: start;
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    min-height: 120px;
    position: relative;
    overflow: hidden;
  }
  .col::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--cat-color, var(--accent));
    opacity: 0.85;
  }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .col-title {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .col-count {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
    background: var(--panel-2);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .col-add {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    font: inherit; font-size: 14px; line-height: 1;
  }
  .col-add:hover { color: var(--accent); background: var(--panel-2); }
  .empty-add {
    width: 100%; text-align: center;
    background: transparent; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 6px;
    padding: 16px 8px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .empty-add:hover { border-color: var(--accent); color: var(--accent); }
  .kbd {
    display: inline-block;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 0 4px; font-size: 10px; color: var(--muted);
    background: var(--panel-2);
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.1s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: center; gap: 6px; }
  .card .type-tag {
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    padding: 2px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.06);
    text-transform: uppercase;
  }
  .type-tag.Skill { color: #6aa6ff; }
  .type-tag.Slash { color: #5ed3a0; }
  .type-tag.Hook { color: #ffa64d; }
  .type-tag.MCP { color: #b48cff; }
  .type-tag.Agent { color: #ff7eb6; }
  .type-tag.Settings { color: #8a93a3; }
  .card .name { font-weight: 500; flex: 1; }
  .card .freq {
    font-size: 10px; color: var(--muted);
    padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,0.04);
  }
  .card .trigger {
    margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 5px 8px;
    color: #e6e9ef;
    display: flex; align-items: center; gap: 6px;
    overflow: hidden;
  }
  .card .trigger code {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: inherit;
  }
  .card .trigger .copy {
    color: var(--muted); font-size: 11px; flex-shrink: 0;
  }
  .card .trigger:hover { border-color: var(--accent); }
  .card .trigger:hover .copy { color: var(--accent); }
  .card .footer {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; min-height: 18px;
  }
  .integrations { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .integration {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 4px;
    font-size: 9px; font-weight: 700;
    background: var(--int-bg, #232a36); color: var(--int-fg, #e6e9ef);
  }
  .integration[title]:hover { outline: 1px solid var(--accent); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 1px 6px; border-radius: 999px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
  }
  .status-pill::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--idea);
  }
  .status-pill.Idea::before { background: var(--idea); }
  .status-pill.Draft::before { background: var(--draft); }
  .status-pill.Active::before { background: var(--active); }
  .status-pill.Paused::before { background: var(--paused); }
  .status-pill.Shipped::before { background: var(--shipped); }
  .status-pill.Archived::before { background: var(--archived); }
  .card .link {
    color: var(--muted); text-decoration: none; font-size: 11px;
  }
  .card .link:hover { color: var(--accent); }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 8px;
    color: var(--text); font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  dialog {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; min-width: 420px;
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  dialog label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  dialog input, dialog select, dialog textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font: inherit;
  }
  dialog textarea { min-height: 60px; resize: vertical; }
  dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  dialog .integrations-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  dialog .integrations-grid label {
    margin: 0; padding: 6px 8px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 5px;
    text-transform: none; letter-spacing: 0; font-size: 12px;
    color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  dialog .integrations-grid input[type=checkbox] { width: auto; margin: 0; }
  dialog .integrations-grid label:has(input:checked) { border-color: var(--accent); background: var(--panel-2); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  dialog button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 14px; cursor: pointer; font: inherit;
  }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Skills &amp; Automations</h1>
  <span class="status" id="status">idle</span>
  <span class="spacer"></span>
  <input class="filter" id="filter" placeholder="filter…   /" />
  <button id="add-btn">+ skill <span class="kbd">n</span></button>
  <button id="pull-btn">↓ pull</button>
  <button id="push-btn">↑ push</button>
</header>
<main>
  <div class="board" id="board"></div>
</main>
<div class="toast" id="toast"></div>

<dialog id="edit-dialog">
  <h2 id="dialog-title">Edit skill</h2>
  <form id="edit-form" method="dialog">
    <label>Name</label>
    <input name="name" required />
    <div class="row">
      <div>
        <label>Category</label>
        <select name="category">
          <option>Plan</option>
          <option>Build</option>
          <option>Ship</option>
          <option>Quality</option>
          <option>Knowledge</option>
          <option>Meta</option>
        </select>
      </div>
      <div>
        <label>Type</label>
        <select name="type">
          <option>Skill</option>
          <option>Slash</option>
          <option>Hook</option>
          <option>MCP</option>
          <option>Agent</option>
          <option>Settings</option>
        </select>
      </div>
    </div>
    <label>Trigger</label>
    <input name="trigger" placeholder="/command-name or event:SessionStart" />
    <div class="row">
      <div>
        <label>Status</label>
        <select name="status">
          <option>Idea</option>
          <option>Draft</option>
          <option>Active</option>
          <option>Paused</option>
          <option>Shipped</option>
          <option>Archived</option>
        </select>
      </div>
      <div>
        <label>Frequency</label>
        <select name="frequency">
          <option value="">—</option>
          <option>Daily</option>
          <option>Weekly</option>
          <option>On demand</option>
          <option>Scheduled</option>
          <option>On event</option>
        </select>
      </div>
    </div>
    <label>Integrations</label>
    <div class="integrations-grid" id="integrations-grid"></div>
    <label>Link</label>
    <input name="link" type="url" placeholder="https://…" />
    <label>Notes</label>
    <textarea name="notes"></textarea>
    <div class="actions">
      <button type="button" id="dialog-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
  const COLUMN_ORDER_KEY = 'skills-column-order';
  const STATUS_ORDER = ['Active', 'Draft', 'Idea', 'Paused', 'Shipped', 'Archived'];
  const CATEGORY_COLORS = {
    Plan: '#6aa6ff',
    Build: '#ffa64d',
    Ship: '#5ed3a0',
    Quality: '#ff5d5d',
    Knowledge: '#b48cff',
    Meta: '#ff7eb6',
    Content: '#6aa6ff',
    Community: '#5ed3a0',
    Agency: '#b48cff',
    Engineering: '#ffa64d',
    Personal: '#ff7eb6',
    Ideas: '#8a93a3',
  };
  const DEFAULT_CATEGORIES = ['Plan', 'Build', 'Ship', 'Quality', 'Knowledge', 'Meta'];
  const INTEGRATIONS = [
    { name: 'GitHub',     short: 'GH', bg: '#24292e', fg: '#fff' },
    { name: 'Notion',     short: 'No', bg: '#000',    fg: '#fff' },
    { name: 'Vercel',     short: '▲',  bg: '#000',    fg: '#fff' },
    { name: 'Firebase',   short: '🔥', bg: '#ffca28', fg: '#000' },
    { name: 'Discord',    short: 'Dc', bg: '#5865f2', fg: '#fff' },
    { name: 'Gmail',      short: '✉',  bg: '#ea4335', fg: '#fff' },
    { name: 'Google',     short: 'G',  bg: '#4285f4', fg: '#fff' },
    { name: 'X',          short: '𝕏',  bg: '#000',    fg: '#fff' },
    { name: 'Browser',    short: '🌐', bg: '#232a36', fg: '#fff' },
    { name: 'Filesystem', short: '📁', bg: '#232a36', fg: '#fff' },
    { name: 'Shell',      short: '❯',  bg: '#232a36', fg: '#5ed3a0' },
  ];
  const INTEGRATION_MAP = Object.fromEntries(INTEGRATIONS.map((i) => [i.name, i]));

  let state = { skills: [], dirty: false, edits: {}, filter: '' };

  const $ = (s) => document.querySelector(s);
  const statusEl = $('#status');
  const toast = $('#toast');

  function setStatus(s) { statusEl.textContent = s; }
  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function groupByCategory(skills) {
    const groups = {};
    for (const cat of DEFAULT_CATEGORIES) groups[cat] = [];
    for (const s of skills) {
      const cat = s.category || 'Uncategorized';
      (groups[cat] = groups[cat] || []).push(s);
    }
    for (const cat of Object.keys(groups)) {
      groups[cat].sort((a, b) => {
        const sa = STATUS_ORDER.indexOf(a.status || 'Idea');
        const sb = STATUS_ORDER.indexOf(b.status || 'Idea');
        if (sa !== sb) return sa - sb;
        return (a.name || '').localeCompare(b.name || '');
      });
    }
    return groups;
  }

  function columnOrder(categories) {
    const saved = JSON.parse(localStorage.getItem(COLUMN_ORDER_KEY) || '[]');
    const result = saved.filter((c) => categories.includes(c));
    for (const c of categories) if (!result.includes(c)) result.push(c);
    return result;
  }

  function render() {
    const filtered = state.filter
      ? state.skills.filter((s) => {
          const hay = `${s.name || ''} ${s.category || ''} ${s.status || ''} ${s.type || ''} ${s.trigger || ''} ${(s.integrations || []).join(' ')} ${s.notes || ''}`.toLowerCase();
          return hay.includes(state.filter);
        })
      : state.skills.filter((s) => s.status !== 'Archived');
    const groups = groupByCategory(filtered);
    if (state.filter) {
      for (const cat of Object.keys(groups)) {
        if (groups[cat].length === 0) delete groups[cat];
      }
    }
    const cats = columnOrder(Object.keys(groups));
    const board = $('#board');
    board.innerHTML = '';
    for (const cat of cats) {
      const col = document.createElement('div');
      col.className = 'col';
      const color = CATEGORY_COLORS[cat];
      if (color) col.style.setProperty('--cat-color', color);
      col.innerHTML = `
        <div class="col-head">
          <span class="col-title">${escapeHtml(cat)}</span>
          <span class="col-count">${groups[cat].length}</span>
          <button class="col-add" data-cat="${escapeAttr(cat)}" title="Add to ${escapeAttr(cat)}">+</button>
        </div>
      `;
      for (const s of groups[cat]) col.appendChild(renderCard(s));
      if (groups[cat].length === 0) {
        const btn = document.createElement('button');
        btn.className = 'empty-add';
        btn.textContent = `+ add to ${cat}`;
        btn.addEventListener('click', () => openEdit({ category: cat }));
        col.appendChild(btn);
      }
      col.querySelector('.col-add').addEventListener('click', () => openEdit({ category: cat }));
      board.appendChild(col);
    }
  }

  function renderCard(s) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = s.id;
    const integrations = (s.integrations || []).map((name) => {
      const meta = INTEGRATION_MAP[name];
      if (!meta) return `<span class="integration" title="${escapeAttr(name)}">${escapeHtml(name[0] || '?')}</span>`;
      return `<span class="integration" title="${escapeAttr(name)}" style="--int-bg:${meta.bg};--int-fg:${meta.fg}">${escapeHtml(meta.short)}</span>`;
    }).join('');
    card.innerHTML = `
      <div class="top">
        ${s.type ? `<span class="type-tag ${escapeAttr(s.type)}">${escapeHtml(s.type)}</span>` : ''}
        <span class="name">${escapeHtml(s.name || 'Untitled')}</span>
        ${s.frequency ? `<span class="freq">${escapeHtml(s.frequency)}</span>` : ''}
      </div>
      ${s.trigger ? `<div class="trigger" data-copy="${escapeAttr(s.trigger)}"><code>${escapeHtml(s.trigger)}</code><span class="copy">copy</span></div>` : ''}
      <div class="footer">
        <div class="integrations">${integrations}</div>
        <span class="status-pill ${s.status || 'Idea'}">${escapeHtml(s.status || 'Idea')}</span>
        ${s.link ? `<a class="link" href="${escapeAttr(s.link)}" target="_top" onclick="event.stopPropagation()">↗</a>` : ''}
      </div>
    `;
    const trig = card.querySelector('.trigger');
    if (trig) {
      trig.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard?.writeText(trig.dataset.copy || '').then(() => {
          flash(`Copied: ${trig.dataset.copy}`);
        });
      });
    }
    card.addEventListener('click', () => openEdit(s));
    return card;
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  function escapeAttr(s) { return escapeHtml(s); }

  function renderIntegrationsGrid(selected = []) {
    const grid = $('#integrations-grid');
    grid.innerHTML = INTEGRATIONS.map((i) => `
      <label><input type="checkbox" name="integration" value="${escapeAttr(i.name)}" ${selected.includes(i.name) ? 'checked' : ''} />${escapeHtml(i.name)}</label>
    `).join('');
  }

  async function pull() {
    setStatus('pulling…');
    try {
      const res = await fetch('/api/sync');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.skills = data.skills || data.projects || [];
      state.edits = {};
      state.dirty = false;
      render();
      setStatus(`pulled ${state.skills.length}`);
      flash(`Pulled ${state.skills.length} skills`);
    } catch (e) {
      setStatus('pull failed');
      flash(`Pull failed: ${e.message}`);
    }
  }

  async function push() {
    if (!Object.keys(state.edits).length) {
      flash('Nothing to push');
      return;
    }
    setStatus('pushing…');
    try {
      const res = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ edits: Object.values(state.edits) }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      setStatus(`pushed ${data.written || 0}`);
      flash(`Pushed ${data.written || 0} changes`);
      await pull();
    } catch (e) {
      setStatus('push failed');
      flash(`Push failed: ${e.message}`);
    }
  }

  function openEdit(s) {
    const dlg = $('#edit-dialog');
    const form = $('#edit-form');
    $('#dialog-title').textContent = s.id ? 'Edit skill' : 'New skill';
    form.name.value = s.name || '';
    form.category.value = s.category || 'Meta';
    form.type.value = s.type || 'Slash';
    form.trigger.value = s.trigger || '';
    form.status.value = s.status || 'Active';
    form.frequency.value = s.frequency || 'On demand';
    form.link.value = s.link || '';
    form.notes.value = s.notes || '';
    form.dataset.id = s.id || '';
    renderIntegrationsGrid(s.integrations || []);
    dlg.showModal();
  }

  $('#dialog-cancel').addEventListener('click', () => $('#edit-dialog').close());

  $('#edit-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const id = form.dataset.id || `new-${Date.now()}`;
    const integrations = Array.from(form.querySelectorAll('input[name=integration]:checked')).map((c) => c.value);
    const edit = {
      id,
      name: form.name.value.trim(),
      category: form.category.value,
      type: form.type.value,
      trigger: form.trigger.value.trim() || null,
      status: form.status.value,
      frequency: form.frequency.value || null,
      integrations,
      link: form.link.value.trim() || null,
      notes: form.notes.value.trim() || null,
      isNew: !form.dataset.id,
    };
    state.edits[id] = edit;
    const idx = state.skills.findIndex((s) => s.id === id);
    if (idx >= 0) state.skills[idx] = { ...state.skills[idx], ...edit };
    else state.skills.push(edit);
    state.dirty = true;
    setStatus('unsaved changes');
    render();
    $('#edit-dialog').close();
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (e.key === '/' && !inField) {
      e.preventDefault();
      $('#filter').focus();
    } else if ((e.key === 'n' || e.key === 'N') && !inField && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      openEdit({});
    } else if (e.key === 'Escape' && inField && e.target.id === 'filter') {
      e.target.value = '';
      state.filter = '';
      render();
      e.target.blur();
    }
  });

  $('#filter').addEventListener('input', (e) => {
    state.filter = e.target.value.trim().toLowerCase();
    render();
  });
  $('#pull-btn').addEventListener('click', pull);
  $('#push-btn').addEventListener('click', push);
  $('#add-btn').addEventListener('click', () => openEdit({}));

  pull();
</script>
</body>
</html>
