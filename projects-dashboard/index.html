<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude Dashboard</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #11151c;
    --panel-2: #161b25;
    --line: #232a36;
    --line-strong: #2f384a;
    --text: #e6e9ef;
    --muted: #8a93a3;
    --accent: #6aa6ff;
    --doing: #6aa6ff;
    --backlog: #8a93a3;
    --blocked: #ff5d5d;
    --done: #5ed3a0;
    --on-hold: #ffd84d;
    --active: #5ed3a0;
    --shipped: #6aa6ff;
    --archived: #5a6273;
    --p0: #ff5d5d;
    --p1: #ffa64d;
    --p2: #ffd84d;
    --p3: #7be08a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font: inherit;
  }
  header button:hover { border-color: var(--accent); }
  header .status { color: var(--muted); font-size: 12px; }
  header input.filter {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; width: 220px;
  }
  header input.filter:focus { outline: none; border-color: var(--accent); }
  main {
    padding: 36px 20px 80px;
    overflow-x: auto;
  }

  /* ─── Level 1: ME/CLIENT ─── */
  .orgchart {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: max-content;
  }
  .me-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding-bottom: 14px;
    position: relative;
  }
  .me-label::after {
    content: '';
    position: absolute; left: 50%; bottom: 0;
    width: 1px; height: 14px;
    background: var(--line);
  }

  /* ─── Level 2: CLAUDE ─── */
  .claude-node {
    background: linear-gradient(180deg, #1d2330, var(--panel-2));
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 12px 24px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--text);
    position: relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 6px 16px rgba(0,0,0,0.4);
    min-width: 180px;
    text-align: center;
  }
  .claude-node .sub {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.16em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .claude-node::after {
    content: '';
    position: absolute; left: 50%; bottom: -22px;
    width: 1px; height: 22px;
    background: var(--line);
  }

  /* ─── Level 3: Projects (the wide row) ─── */
  .projects-row {
    display: flex;
    gap: 16px;
    margin-top: 22px;
    position: relative;
    padding-top: 18px;
    align-items: start;
  }
  .projects-row::before {
    content: '';
    position: absolute;
    top: 18px;
    left: var(--bus-left, 0);
    right: var(--bus-right, 0);
    height: 1px;
    background: var(--line);
  }
  .project {
    width: 260px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .project::before {
    content: '';
    position: absolute; left: 50%; top: -18px;
    width: 1px; height: 18px;
    background: var(--line);
  }
  .project-head {
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 12px;
    position: relative;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .project-head::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--cat-color, var(--accent));
    border-radius: 8px 0 0 8px;
  }
  .project-head .name {
    font-weight: 600;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .project-head .pri {
    font-size: 9px; font-weight: 800;
    padding: 1px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.06);
    margin-left: auto;
  }
  .pri.P0 { color: var(--p0); }
  .pri.P1 { color: var(--p1); }
  .pri.P2 { color: var(--p2); }
  .pri.P3 { color: var(--p3); }
  .project-head .meta {
    font-size: 11px; color: var(--muted);
    margin-top: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 1px 6px; border-radius: 999px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
  }
  .status-pill::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--backlog);
  }
  .status-pill.Active::before     { background: var(--active); }
  .status-pill.On-hold::before    { background: var(--on-hold); }
  .status-pill.Shipped::before    { background: var(--shipped); }
  .status-pill.Archived::before   { background: var(--archived); }
  .status-pill.Backlog::before    { background: var(--backlog); }
  .status-pill.Doing::before      { background: var(--doing); }
  .status-pill.Blocked::before    { background: var(--blocked); }
  .status-pill.Done::before       { background: var(--done); }

  /* ─── Level 4: Tasks (hanging from project trunk) ─── */
  .tasks-trunk {
    position: relative;
    margin-top: 6px;
    padding-top: 6px;
    padding-left: 24px;
  }
  .tasks-trunk::before {
    content: '';
    position: absolute;
    left: 12px; top: 0; bottom: 8px;
    width: 1px;
    background: var(--line);
  }
  .task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    position: relative;
  }
  .task::before {
    content: '';
    position: absolute;
    left: -12px; top: 16px;
    width: 12px; height: 1px;
    background: var(--line);
  }
  .task .top {
    display: flex; align-items: center; gap: 6px;
  }
  .task .name {
    font-size: 12.5px;
    font-weight: 500;
    flex: 1;
  }
  .task .star {
    font-size: 11px;
    line-height: 1;
  }
  .task.is-doing .star    { color: var(--doing); }
  .task.is-backlog .star  { color: var(--muted); }
  .task.is-blocked .star  { color: var(--blocked); }
  .task.is-done .star     { color: var(--done); }
  .task .pri {
    font-size: 9px; font-weight: 800;
    padding: 1px 4px; border-radius: 3px;
    background: rgba(255,255,255,0.05);
  }
  .task .due {
    font-size: 10px; color: var(--muted);
    margin-top: 2px;
  }

  /* ─── Level 5: Agents (small chips inside each task) ─── */
  .agents {
    display: flex; flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .agent {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--agent-bg, rgba(106,166,255,0.12));
    color: var(--agent-fg, #cfe1ff);
    border: 1px solid var(--agent-bd, rgba(106,166,255,0.28));
    text-decoration: none;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .agent:hover { filter: brightness(1.15); }
  .agent.type-Skill    { --agent-bg: rgba(106,166,255,0.12); --agent-fg: #cfe1ff; --agent-bd: rgba(106,166,255,0.28); }
  .agent.type-Slash    { --agent-bg: rgba(94,211,160,0.12);  --agent-fg: #d6f3e5; --agent-bd: rgba(94,211,160,0.28); }
  .agent.type-Hook     { --agent-bg: rgba(255,166,77,0.12);  --agent-fg: #ffd9b3; --agent-bd: rgba(255,166,77,0.28); }
  .agent.type-MCP      { --agent-bg: rgba(180,140,255,0.12); --agent-fg: #ddcfff; --agent-bd: rgba(180,140,255,0.28); }
  .agent.type-Agent    { --agent-bg: rgba(255,126,182,0.12); --agent-fg: #ffd1e3; --agent-bd: rgba(255,126,182,0.28); }
  .agent.type-Settings { --agent-bg: rgba(138,147,163,0.12); --agent-fg: #cbd0da; --agent-bd: rgba(138,147,163,0.28); }

  .empty-state {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
  }

  a.task-link, a.project-link { color: inherit; text-decoration: none; }
  a.task-link:hover .name { color: var(--accent); }
  a.project-link:hover .name { color: var(--accent); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 8px;
    color: var(--text); font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Claude Dashboard</h1>
  <span class="status" id="status">idle</span>
  <span class="spacer"></span>
  <input class="filter" id="filter" placeholder="filter projects, tasks, agents…   /" />
  <button id="pull-btn">↓ pull</button>
</header>
<main>
  <div class="orgchart">
    <div class="me-label">ME / CLIENT</div>
    <div class="claude-node">
      CLAUDE
      <span class="sub" id="claude-sub">0 projects · 0 tasks · 0 agents</span>
    </div>
    <div class="projects-row" id="projects-row"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
  const CATEGORY_COLORS = {
    Engineering: '#ffa64d',
    Content: '#6aa6ff',
    Community: '#5ed3a0',
    Agency: '#b48cff',
    Personal: '#ff7eb6',
  };
  const STATUS_ORDER_TASK = ['Doing', 'Blocked', 'Backlog', 'Done'];
  const STATUS_ORDER_PROJECT = ['Active', 'On hold', 'Shipped', 'Archived'];

  let state = { projects: [], counts: {}, filter: '' };

  const $ = (s) => document.querySelector(s);
  const statusEl = $('#status');
  const toast = $('#toast');
  function setStatus(s) { statusEl.textContent = s; }
  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }
  const esc = escapeHtml;

  function matchesFilter(s, q) {
    if (!q) return true;
    const hay = `${s.name || ''} ${s.category || ''} ${s.status || ''} ${s.priority || ''} ${s.notes || ''} ${(s.tasks || []).map((t) => `${t.name || ''} ${(t.agents || []).map((a) => a.name).join(' ')}`).join(' ')}`.toLowerCase();
    return hay.includes(q);
  }

  function render() {
    const q = state.filter;
    const projects = state.projects.filter((p) => matchesFilter(p, q));
    const row = $('#projects-row');
    row.innerHTML = '';

    if (projects.length === 0) {
      row.innerHTML = `<div class="empty-state">No projects match.</div>`;
      return;
    }

    projects.sort((a, b) => {
      const sa = STATUS_ORDER_PROJECT.indexOf(a.status || 'Active');
      const sb = STATUS_ORDER_PROJECT.indexOf(b.status || 'Active');
      if (sa !== sb) return sa - sb;
      const oa = a.order ?? 999, ob = b.order ?? 999;
      if (oa !== ob) return oa - ob;
      return (a.name || '').localeCompare(b.name || '');
    });

    for (const p of projects) {
      row.appendChild(renderProject(p));
    }

    // adjust the horizontal bus so it doesn't overhang the outermost children
    requestAnimationFrame(() => {
      const cards = row.querySelectorAll('.project');
      if (cards.length < 2) {
        row.style.setProperty('--bus-left', '50%');
        row.style.setProperty('--bus-right', '50%');
      } else {
        const first = cards[0].offsetLeft + cards[0].offsetWidth / 2;
        const last = cards[cards.length - 1].offsetLeft + cards[cards.length - 1].offsetWidth / 2;
        row.style.setProperty('--bus-left', `${first}px`);
        row.style.setProperty('--bus-right', `${row.offsetWidth - last}px`);
      }
    });
  }

  function renderProject(p) {
    const el = document.createElement('div');
    el.className = 'project';
    const color = CATEGORY_COLORS[p.category] || '#6aa6ff';
    el.style.setProperty('--cat-color', color);

    const tasks = (p.tasks || []).slice().sort((a, b) => {
      const sa = STATUS_ORDER_TASK.indexOf(a.status || 'Backlog');
      const sb = STATUS_ORDER_TASK.indexOf(b.status || 'Backlog');
      if (sa !== sb) return sa - sb;
      const oa = a.order ?? 999, ob = b.order ?? 999;
      if (oa !== ob) return oa - ob;
      return (a.name || '').localeCompare(b.name || '');
    });

    const statusClass = (p.status || 'Active').replace(/\s+/g, '-');
    const safeUrl = esc(p.url || '#');
    const head = `
      <a class="project-link project-head" href="${safeUrl}" target="_top">
        <div class="name">
          <span>${esc(p.name || 'Untitled')}</span>
          ${p.priority ? `<span class="pri ${p.priority}">${p.priority}</span>` : ''}
        </div>
        <div class="meta">
          <span class="status-pill ${statusClass}">${esc(p.status || 'Active')}</span>
          ${tasks.length ? `<span>${tasks.length} task${tasks.length === 1 ? '' : 's'}</span>` : '<span>no tasks</span>'}
        </div>
      </a>
    `;

    const trunkInner = tasks.length
      ? tasks.map(renderTask).join('')
      : `<div class="task" style="padding:6px 10px; opacity:0.6">
           <div class="top"><span class="name" style="font-size:11px; font-style:italic; color:var(--muted)">no tasks yet</span></div>
         </div>`;

    el.innerHTML = head + `<div class="tasks-trunk">${trunkInner}</div>`;
    return el;
  }

  function renderTask(t) {
    const statusClass = `is-${String(t.status || 'backlog').toLowerCase()}`;
    const agents = (t.agents || []).map((a) => {
      const cls = `agent type-${esc(a.type || 'Skill')}`;
      const label = esc(a.name || a.trigger || '?');
      const href = esc(a.url || '#');
      return `<a class="${cls}" href="${href}" target="_top" title="${esc(a.trigger || a.name || '')}">${label}</a>`;
    }).join('');
    return `
      <a class="task-link task ${statusClass}" href="${esc(t.url || '#')}" target="_top">
        <div class="top">
          <span class="name">${esc(t.name || 'Untitled')}</span>
          ${t.priority ? `<span class="pri ${t.priority}">${t.priority}</span>` : ''}
          <span class="star" title="${esc(t.status || 'Backlog')}">★</span>
        </div>
        ${t.due ? `<div class="due">due ${esc(t.due)}</div>` : ''}
        ${agents ? `<div class="agents">${agents}</div>` : ''}
      </a>
    `;
  }

  async function pull() {
    setStatus('pulling…');
    try {
      const res = await fetch('/api/sync');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.projects = data.projects || [];
      state.counts = data.counts || {};
      const c = state.counts;
      $('#claude-sub').textContent = `${c.projects || 0} projects · ${c.tasks || 0} tasks · ${c.skills || 0} agents`;
      render();
      setStatus(`pulled ${c.projects || 0}p / ${c.tasks || 0}t / ${c.skills || 0}a`);
      flash(`Pulled ${c.projects || 0} projects, ${c.tasks || 0} tasks, ${c.skills || 0} agents`);
    } catch (e) {
      setStatus('pull failed');
      flash(`Pull failed: ${e.message}`);
    }
  }

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (e.key === '/' && !inField) {
      e.preventDefault();
      $('#filter').focus();
    } else if (e.key === 'Escape' && inField && e.target.id === 'filter') {
      e.target.value = '';
      state.filter = '';
      render();
      e.target.blur();
    }
  });

  $('#filter').addEventListener('input', (e) => {
    state.filter = e.target.value.trim().toLowerCase();
    render();
  });
  $('#pull-btn').addEventListener('click', pull);

  pull();
</script>
</body>
</html>
